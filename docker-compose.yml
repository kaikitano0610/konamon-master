version: '3.8'

services:
  db:
    image: mysql:8.4
    container_name: konamon_mysql
    environment:
      # ここはメインの .env から読み込まれる
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB}
      TZ: Asia/Tokyo
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER}", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: konamon_backend
    ports:
      - "5001:5000"
    volumes:
      - .:/code
      - ./tsugidoko-467608-f85dcf77aaed.json:/code/google-credentials.json
    working_dir: /code
    env_file:
      - .env # <-- ここを .env に統一
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: konamon_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - .env # <-- ここも .env に統一
    depends_on:
      - backend

volumes:
  dbdata: