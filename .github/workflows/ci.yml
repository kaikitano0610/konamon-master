# .github/workflows/ci.yml
name: Frontend and Backend CI

on: [push]

jobs:
  # フロントエンドのチェック用ジョブ
  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend # コマンドはfrontend/ で実行

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

  # バックエンドのチェック用ジョブ
  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend # コマンドは backend/ で実行

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9' # Dockerfileのバージョンと合わせる
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run lint with flake8
        run: flake8 .

      - name: Run tests with pytest
        run: pytest